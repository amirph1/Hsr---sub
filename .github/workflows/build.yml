name: Build HSR Auto Translator APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android project & inject native code
        run: |
          flutter create --org com.amir --project-name hsr_translator --platforms=android .
          mkdir -p android/app/src/main/kotlin/com/amir/hsr_translator
          cp native/MainActivity.kt android/app/src/main/kotlin/com/amir/hsr_translator/MainActivity.kt
          cp native/OverlayService.kt android/app/src/main/kotlin/com/amir/hsr_translator/OverlayService.kt

          mkdir -p android/app/src/main/assets/fonts
          curl -L -o android/app/src/main/assets/fonts/Vazirmatn.ttf "https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf/Vazirmatn-Medium.ttf"

          if [ -f android/app/build.gradle.kts ]; then
            echo 'dependencies { implementation("com.google.mlkit:text-recognition:16.0.1") }' >> android/app/build.gradle.kts
          else
            echo 'dependencies { implementation "com.google.mlkit:text-recognition:16.0.1" }' >> android/app/build.gradle
          fi

          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              content = f.read()
          perms = """    <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          """
          service = """        <service
                  android:name=".OverlayService"
                  android:exported="false"
                  android:foregroundServiceType="mediaProjection" />
          """
          content = content.replace("<application", perms + "\n    <application", 1)
          content = content.replace("</application>", service + "\n    </application>", 1)
          with open(path, "w") as f:
              f.write(content)
          '

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: hsr-auto-translator-apk
          path: build/app/outputs/flutter-apk/app-release.apk
